name: Build PixelMC

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build plugin
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PixelMC-JAR
          path: build/libs/*.jar
