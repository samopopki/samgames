
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SamGamesLive</title>
<style>
body {
  margin: 0;
  background: #090912;
  color: white;
  font-family: Tahoma, sans-serif;
  text-align: center;
}
header {
  padding: 25px;
  background: #171126;
  color: #bd75ff;
  font-size: 28px;
  font-weight: bold;
}
.panel {
  max-width: 850px;
  margin: 25px auto;
  padding: 20px;
  background: #171522;
  border: 1px solid #7435a8;
  border-radius: 15px;
}
input {
  width: 85%;
  padding: 12px;
  margin: 8px;
  border-radius: 8px;
  border: 1px solid #8144ba;
  background: #090912;
  color: white;
}
button {
  padding: 12px 22px;
  margin: 8px;
  background: #873bd1;
  color: white;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
iframe {
  width: 100%;
  height: 550px;
  border: 1px solid #7435a8;
  border-radius: 10px;
  background: #080810;
}
</style>
</head>
<body>

<header>🎮 SamGamesLive</header>

<div class="panel">
  <h3>تنظیمات لایو</h3>

  <input id="liveUrl"
    placeholder="لینک لایو آپارات را وارد کن">

  <br>
  <button onclick="connectLive()">اتصال به لایو</button>
  <button onclick="openLive()">باز کردن در آپارات</button>

  <h3>📺 چت و لایو</h3>
  <iframe id="liveFrame"
    title="Aparat Live"
    allowfullscreen>
  </iframe>

  <p id="status">هنوز لایوی انتخاب نشده است.</p>
</div>

<script>
const input = document.getElementById("liveUrl");
const frame = document.getElementById("liveFrame");
const statusText = document.getElementById("status");

input.value = localStorage.getItem("samLive") || "";

function connectLive() {
  const url = input.value.trim();

  if (!url.startsWith("https://www.aparat.com/") &&
      !url.startsWith("https://aparat.com/")) {
    alert("لینک معتبر آپارات وارد کن");
    return;
  }

  localStorage.setItem("samLive", url);
  frame.src = url;
  statusText.textContent = "لینک لایو انتخاب شد.";
}

function openLive() {
  const url = input.value.trim();
  if (url.startsWith("https://www.aparat.com/") ||
      url.startsWith("https://aparat.com/")) {
    window.open(url, "_blank");
  } else {
    alert("اول لینک لایو را وارد کن");
  }
}

if (input.value) {
  frame.src = input.value;
}
</script>

</body>
</html>
